title: "Fasih Tariq"
email: fasihtariq2611@gmail.com
description: >-
  Personal site of Fasih Tariq. Computer vision: detection and recognition,
  large-scale video pipelines, and generative models.
github_username: fasih2611
# Drop a cv.pdf in assets/ and set this to /assets/cv.pdf to show a CV link
cv_url:

remote_theme: daviddarnes/garth
logo: "/assets/logo.svg"

url: "https://fasih2611.github.io"
baseurl: ""
lang: en
encoding: utf-8

permalink: /blog/:year/:month/:day/:title/
excerpt_separator: <!-- more -->

# Build in your local timezone, and don't silently drop posts dated "today"
# when it is still yesterday in UTC.
timezone: Asia/Karachi
future: true

sass:
  style: compressed

collections:
  posts:
    title: Blog
    output: true
    description: "Notes on computer vision, the systems engineering underneath it, and generative models."

plugins:
  - jekyll-remote-theme
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - STYLEGUIDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
