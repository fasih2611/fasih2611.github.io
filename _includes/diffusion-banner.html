<!-- A pine treeline emerging from grain and dissolving back into it:
     reverse diffusion, then forward. Inline SVG shapes driven entirely by CSS
     keyframes (see _sass/_wood.scss) — no SMIL, no JavaScript, no image files.

     The three grain layers carry different turbulence seeds and are flickered
     out of phase, which reads as moving noise; the envelope on their parent
     group fades the whole veil as the trees sharpen. -->
<div class="diffusion-banner" aria-hidden="true">
  <svg viewBox="0 0 1200 240" preserveAspectRatio="xMidYMax slice" role="presentation">
    <defs>
      <filter id="grain-a" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="3"/>
        <feColorMatrix type="saturate" values="0.12"/>
      </filter>
      <filter id="grain-b" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" seed="17"/>
        <feColorMatrix type="saturate" values="0.12"/>
      </filter>
      <filter id="grain-c" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="41"/>
        <feColorMatrix type="saturate" values="0.12"/>
      </filter>
    </defs>

    <g class="treeline">
      <g class="row-back">
        <polygon points="70,210 100,120 130,210"/>
        <polygon points="170,210 196,140 222,210"/>
        <polygon points="250,210 284,110 318,210"/>
        <polygon points="350,210 376,146 402,210"/>
        <polygon points="880,210 914,112 948,210"/>
        <polygon points="980,210 1006,144 1032,210"/>
        <polygon points="1060,210 1094,118 1128,210"/>
      </g>
      <g class="row-front">
        <polygon points="430,212 470,96 510,212"/>
        <polygon points="530,212 562,132 594,212"/>
        <rect x="596" y="176" width="8" height="36"/>
        <polygon points="560,180 600,60 640,180"/>
        <polygon points="566,142 600,34 634,142"/>
        <polygon points="572,104 600,14 628,104"/>
        <polygon points="640,212 674,124 708,212"/>
        <polygon points="720,212 758,100 796,212"/>
      </g>
      <rect class="floor" x="0" y="210" width="1200" height="30"/>
    </g>

    <g class="veils">
      <rect class="veil v1" x="0" y="0" width="1200" height="240" filter="url(#grain-a)"/>
      <rect class="veil v2" x="0" y="0" width="1200" height="240" filter="url(#grain-b)"/>
      <rect class="veil v3" x="0" y="0" width="1200" height="240" filter="url(#grain-c)"/>
    </g>
  </svg>
</div>
