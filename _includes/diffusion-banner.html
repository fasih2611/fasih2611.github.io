<!-- A pine treeline emerging from noise and dissolving back into it:
     reverse diffusion, then forward. Pure inline SVG + SMIL, no image files
     and no JavaScript. Colours come from _sass/_wood.scss. -->
<div class="diffusion-banner" aria-hidden="true">
  <svg viewBox="0 0 1200 240" preserveAspectRatio="xMidYMax slice" role="presentation">
    <defs>
      <!-- Displaces the treeline by a noise field; scale animates to zero. -->
      <filter id="denoise" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="7" result="field">
          <animate attributeName="baseFrequency"
                   values="0.028;0.02;0.028" dur="14s" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="field" xChannelSelector="R" yChannelSelector="G">
          <animate attributeName="scale"
                   values="120;120;0;0;120"
                   keyTimes="0;0.06;0.42;0.76;1"
                   dur="14s" repeatCount="indefinite"
                   calcMode="spline"
                   keySplines="0 0 1 1; .25 .1 .25 1; 0 0 1 1; .5 0 .75 1"/>
        </feDisplacementMap>
      </filter>

      <!-- Static grain used as the visible noise veil. -->
      <filter id="grain" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" seed="3"/>
        <feColorMatrix type="saturate" values="0.15"/>
      </filter>
    </defs>

    <!-- Noise veil: opaque when the treeline is scrambled, gone when resolved. -->
    <rect class="veil" x="0" y="0" width="1200" height="240" filter="url(#grain)">
      <animate attributeName="opacity"
               values="0.85;0.85;0;0;0.85"
               keyTimes="0;0.06;0.42;0.76;1"
               dur="14s" repeatCount="indefinite"/>
    </rect>

    <g class="treeline" filter="url(#denoise)">
      <!-- back row, smaller and paler -->
      <g class="row-back">
        <polygon points="70,210 100,120 130,210"/>
        <polygon points="170,210 196,140 222,210"/>
        <polygon points="250,210 284,110 318,210"/>
        <polygon points="350,210 376,146 402,210"/>
        <polygon points="880,210 914,112 948,210"/>
        <polygon points="980,210 1006,144 1032,210"/>
        <polygon points="1060,210 1094,118 1128,210"/>
      </g>
      <!-- front row -->
      <g class="row-front">
        <polygon points="430,212 470,96 510,212"/>
        <polygon points="530,212 562,132 594,212"/>
        <rect x="596" y="176" width="8" height="36"/>
        <polygon points="560,180 600,60 640,180"/>
        <polygon points="566,142 600,34 634,142"/>
        <polygon points="572,104 600,14 628,104"/>
        <polygon points="640,212 674,124 708,212"/>
        <polygon points="720,212 758,100 796,212"/>
      </g>
      <!-- forest floor -->
      <rect class="floor" x="0" y="210" width="1200" height="30"/>
    </g>
  </svg>
</div>
